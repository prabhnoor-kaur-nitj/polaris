<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- POLARIS mark: polar star on a compass rose. Flat ink + ice-blue accent. -->
  <rect width="512" height="512" rx="96" fill="#0d1015"/>
  <g stroke="#242c37" stroke-width="3" fill="none">
    <circle cx="256" cy="256" r="196"/>
    <circle cx="256" cy="256" r="150"/>
  </g>
  <!-- cardinal ticks: N/E/S/W -->
  <g stroke="#7fb4c9" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="42"  x2="256" y2="78"/>
    <line x1="256" y1="434" x2="256" y2="470"/>
    <line x1="42"  y1="256" x2="78"  y2="256"/>
    <line x1="434" y1="256" x2="470" y2="256"/>
  </g>
  <!-- polar star: long N/S points, shorter E/W points -->
  <path d="M256 96 L278 234 L256 256 L234 234 Z" fill="#e8e4d8"/>
  <path d="M256 416 L234 278 L256 256 L278 278 Z" fill="#e8e4d8"/>
  <path d="M416 256 L278 278 L256 256 L278 234 Z" fill="#7fb4c9"/>
  <path d="M96 256 L234 234 L256 256 L234 278 Z" fill="#7fb4c9"/>
  <circle cx="256" cy="256" r="18" fill="#e8e4d8"/>
</svg>
