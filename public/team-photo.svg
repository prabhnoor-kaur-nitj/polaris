<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="pt-title pt-desc">
  <title id="pt-title">The POLARIS expedition team</title>
  <desc id="pt-desc">Stylized silhouettes of six expedition crew members standing together in front of an Antarctic research station under an aurora sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="0.7" stop-color="#14213f"/>
      <stop offset="1" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5d4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#48cae4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274b6d"/>
      <stop offset="1" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3f63"/>
      <stop offset="1" stop-color="#16223c"/>
    </linearGradient>
  </defs>

  <rect width="900" height="440" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#d7f4ff">
    <circle cx="70" cy="48" r="1.6"/><circle cx="160" cy="90" r="1.2"/><circle cx="240" cy="36" r="1.8"/>
    <circle cx="330" cy="70" r="1.2"/><circle cx="420" cy="30" r="1.6"/><circle cx="510" cy="84" r="1.2"/>
    <circle cx="600" cy="42" r="1.8"/><circle cx="690" cy="76" r="1.2"/><circle cx="770" cy="34" r="1.6"/>
    <circle cx="840" cy="88" r="1.2"/><circle cx="120" cy="130" r="1.1"/><circle cx="740" cy="120" r="1.1"/>
  </g>

  <!-- aurora bands -->
  <path d="M-20 150 C 150 90, 300 190, 470 120 S 760 70, 920 130" stroke="url(#aurora)" stroke-width="26" fill="none" opacity="0.5"/>
  <path d="M-20 110 C 180 50, 340 150, 520 90 S 800 40, 920 100" stroke="url(#aurora)" stroke-width="14" fill="none" opacity="0.7"/>

  <!-- research station -->
  <g fill="#16223c" stroke="#48cae4" stroke-opacity="0.5">
    <rect x="620" y="240" width="150" height="70" rx="8"/>
    <path d="M612 240 L695 200 L778 240 Z"/>
    <rect x="648" y="262" width="18" height="18" fill="#48cae4" fill-opacity="0.7" stroke="none"/>
    <rect x="686" y="262" width="18" height="18" fill="#48cae4" fill-opacity="0.35" stroke="none"/>
    <rect x="724" y="262" width="18" height="18" fill="#48cae4" fill-opacity="0.7" stroke="none"/>
    <line x1="695" y1="200" x2="695" y2="168" stroke="#48cae4" stroke-opacity="0.6"/>
    <circle cx="695" cy="164" r="4" fill="#ff4d4d" stroke="none"/>
  </g>

  <!-- ice ground -->
  <path d="M0 330 C 140 310, 300 340, 460 328 S 760 314, 900 332 L900 440 L0 440 Z" fill="url(#ice)"/>
  <path d="M0 352 C 180 338, 380 358, 560 348 S 820 338, 900 350" stroke="#48cae4" stroke-opacity="0.25" fill="none"/>

  <!-- team figures: master + operators + observers -->
  <g>
    <!-- figure 1 (master, center-tall) -->
    <g transform="translate(430,196)">
      <circle cx="0" cy="0" r="16" fill="url(#figure)" stroke="#00f5d4" stroke-opacity="0.8"/>
      <path d="M-22 108 L-18 30 Q0 16 18 30 L22 108 Z" fill="url(#figure)" stroke="#00f5d4" stroke-opacity="0.8"/>
      <path d="M-26 52 L-38 96 M26 52 L40 92" stroke="url(#figure)" stroke-width="11" stroke-linecap="round"/>
    </g>
    <!-- figure 2 -->
    <g transform="translate(340,214)">
      <circle cx="0" cy="0" r="14" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.7"/>
      <path d="M-20 100 L-16 28 Q0 15 16 28 L20 100 Z" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.7"/>
      <path d="M-24 50 L-34 90 M24 50 L34 86" stroke="url(#figure)" stroke-width="10" stroke-linecap="round"/>
    </g>
    <!-- figure 3 -->
    <g transform="translate(520,214)">
      <circle cx="0" cy="0" r="14" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.7"/>
      <path d="M-20 100 L-16 28 Q0 15 16 28 L20 100 Z" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.7"/>
      <path d="M-24 50 L-36 88 M24 50 L32 92" stroke="url(#figure)" stroke-width="10" stroke-linecap="round"/>
    </g>
    <!-- figure 4 -->
    <g transform="translate(258,234)">
      <circle cx="0" cy="0" r="12" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.5"/>
      <path d="M-17 88 L-14 25 Q0 13 14 25 L17 88 Z" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.5"/>
      <path d="M-20 44 L-30 80 M20 44 L28 78" stroke="url(#figure)" stroke-width="9" stroke-linecap="round"/>
    </g>
    <!-- figure 5 -->
    <g transform="translate(600,234)">
      <circle cx="0" cy="0" r="12" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.5"/>
      <path d="M-17 88 L-14 25 Q0 13 14 25 L17 88 Z" fill="url(#figure)" stroke="#48cae4" stroke-opacity="0.5"/>
      <path d="M-20 44 L-28 82 M20 44 L30 78" stroke="url(#figure)" stroke-width="9" stroke-linecap="round"/>
    </g>
    <!-- figure 6 (with radio mast) -->
    <g transform="translate(680,240)">
      <circle cx="0" cy="0" r="11" fill="url(#figure)" stroke="#ff4d4d" stroke-opacity="0.6"/>
      <path d="M-15 82 L-13 23 Q0 12 13 23 L15 82 Z" fill="url(#figure)" stroke="#ff4d4d" stroke-opacity="0.5"/>
      <line x1="0" y1="12" x2="0" y2="-16" stroke="#ff4d4d" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="0" cy="-19" r="3" fill="#ff4d4d" fill-opacity="0.9"/>
    </g>
  </g>

  <!-- ground glow under team -->
  <ellipse cx="460" cy="392" rx="300" ry="16" fill="#48cae4" opacity="0.08"/>
</svg>
